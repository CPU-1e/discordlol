<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord by Nexora Hub!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            discord: {
              darkest: '#1e1f22',
              darker: '#2b2d31',
              dark: '#313338',
              light: '#383a40',
              accent: '#5865f2',
              green: '#23a55a',
              text: '#dbdee1',
              muted: '#949ba4'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-discord-dark flex overflow-hidden text-discord-text font-sans antialiased">

  <!-- AUTHENTICATION OVERLAY -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-discord-darkest flex items-center justify-center p-4">
    <div class="bg-discord-darker p-8 rounded-lg shadow-xl w-full max-w-md border border-black/20 text-center">
      <div class="w-16 h-16 bg-discord-accent rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-brands fa-discord text-3xl text-white"></i>
      </div>
      <h2 class="text-2xl font-bold text-white mb-1">Discord by Nexora Hub</h2>
      <p class="text-xs text-discord-muted mb-6">Enter your credentials to log in or create an account.</p>

      <form id="auth-form" class="space-y-4 text-left">
        <div>
          <label class="text-xs font-bold text-discord-muted uppercase">Username</label>
          <input id="auth-username" type="text" required placeholder="Choose a Username" class="w-full mt-1 p-2.5 rounded bg-discord-darkest border border-black/40 text-white focus:outline-none focus:border-discord-accent text-sm">
        </div>
        <div>
          <label class="text-xs font-bold text-discord-muted uppercase">Password</label>
          <input id="auth-password" type="password" required placeholder="••••••••" class="w-full mt-1 p-2.5 rounded bg-discord-darkest border border-black/40 text-white focus:outline-none focus:border-discord-accent text-sm">
        </div>
        <button type="submit" class="w-full bg-discord-accent hover:bg-discord-accent/80 text-white font-semibold py-2.5 rounded transition duration-200">
          Login / Sign Up
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL: CREATE SERVER -->
  <div id="create-server-modal" class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 hidden">
    <div class="bg-discord-darker p-6 rounded-lg w-full max-w-md border border-black/20">
      <h3 class="text-xl font-bold text-white mb-1">Customize Your Server</h3>
      <p class="text-xs text-discord-muted mb-4">Give your new server a personality with a name.</p>
      <input id="new-server-name" type="text" placeholder="Server Name" class="w-full p-2.5 rounded bg-discord-darkest border border-black/40 text-white focus:outline-none focus:border-discord-accent text-sm mb-4">
      <div class="flex justify-end space-x-3">
        <button onclick="closeModals()" class="px-4 py-2 text-sm text-discord-muted hover:underline">Cancel</button>
        <button onclick="confirmCreateServer()" class="px-4 py-2 text-sm bg-discord-accent hover:bg-discord-accent/80 text-white font-semibold rounded">Create</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD FRIEND -->
  <div id="add-friend-modal" class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 hidden">
    <div class="bg-discord-darker p-6 rounded-lg w-full max-w-md border border-black/20">
      <h3 class="text-xl font-bold text-white mb-1">Add Friend via Live ID</h3>
      <p class="text-xs text-discord-muted mb-4">Paste your friend's Live ID to connect directly.</p>
      <input id="friend-peer-id" type="text" placeholder="e.g. nexora-john-8492" class="w-full p-2.5 rounded bg-discord-darkest border border-black/40 text-white focus:outline-none focus:border-discord-accent text-sm mb-4">
      <div class="flex justify-end space-x-3">
        <button onclick="closeModals()" class="px-4 py-2 text-sm text-discord-muted hover:underline">Cancel</button>
        <button onclick="confirmAddFriend()" class="px-4 py-2 text-sm bg-discord-green hover:bg-discord-green/80 text-white font-semibold rounded">Send Request</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-screen" class="flex w-full h-full hidden">
    <!-- 1. SERVERS SIDEBAR -->
    <aside class="w-[72px] bg-discord-darkest flex flex-col items-center py-3 space-y-2 select-none z-20 shrink-0">
      <!-- Direct Messages Home Button -->
      <div class="relative group flex items-center justify-center w-full">
        <button onclick="switchToDMView()" class="w-12 h-12 rounded-[16px] bg-discord-accent text-white flex items-center justify-center transition-all duration-200 shadow-md">
          <i class="fa-brands fa-discord text-2xl"></i>
        </button>
      </div>

      <div class="w-8 h-[2px] bg-discord-light rounded my-1"></div>

      <!-- Server List Container -->
      <div id="server-list" class="flex-1 w-full space-y-2 overflow-y-auto no-scrollbar flex flex-col items-center">
        <!-- Rendered Dynamically -->
      </div>

      <!-- Add Server Button -->
      <button onclick="openCreateServerModal()" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-discord-darker hover:bg-discord-green text-discord-green hover:text-white flex items-center justify-center transition-all duration-200" title="Create a Server">
        <i class="fa-solid fa-plus text-lg"></i>
      </button>
    </aside>

    <!-- 2. CHANNELS / FRIENDS SIDEBAR -->
    <aside class="w-60 bg-discord-darker flex flex-col select-none shrink-0 border-r border-black/10">
      <header class="h-12 border-b border-black/20 px-4 flex items-center justify-between shadow-sm font-bold text-white">
        <span id="sidebar-header-title" class="truncate">Discord by Nexora Hub</span>
      </header>

      <div class="flex-1 overflow-y-auto p-2 space-y-4">
        <!-- Live ID Display Box -->
        <div class="p-2 bg-discord-darkest rounded border border-black/30">
          <span class="text-[10px] font-bold text-discord-muted uppercase tracking-wider block">Your Live ID</span>
          <div onclick="copyMyId()" id="my-peer-id" class="text-xs font-mono text-discord-accent truncate cursor-pointer hover:underline mt-0.5" title="Click to copy">
            Initializing...
          </div>
        </div>

        <div id="channel-or-friend-container">
          <!-- Channels or Friend DMs injected here -->
        </div>
      </div>

      <!-- User Profile Footer -->
      <footer class="h-14 bg-[#232428] px-2 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2 p-1 rounded flex-1 min-w-0">
          <div id="user-avatar" class="w-8 h-8 rounded-full bg-discord-accent flex items-center justify-center text-white font-bold text-sm">?</div>
          <div class="flex flex-col min-w-0 flex-1">
            <span id="user-display-name" class="text-xs font-semibold text-white truncate">User</span>
            <span class="text-[10px] text-discord-green truncate">● Online</span>
          </div>
        </div>
        <button onclick="logout()" class="w-8 h-8 hover:bg-discord-light hover:text-red-400 text-discord-muted rounded flex items-center justify-center" title="Logout">
          <i class="fa-solid fa-right-from-bracket text-xs"></i>
        </button>
      </footer>
    </aside>

    <!-- 3. MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col bg-discord-dark min-w-0">
      <header class="h-12 border-b border-black/20 px-4 flex items-center justify-between shadow-sm shrink-0">
        <div class="flex items-center space-x-2 min-w-0">
          <i id="header-icon" class="fa-solid fa-hashtag text-discord-muted text-xl"></i>
          <span id="chat-title" class="font-bold text-white truncate">general</span>
        </div>
        <div id="header-actions" class="flex items-center space-x-2">
          <!-- Dynamic Header Action Buttons -->
        </div>
      </header>

      <!-- Chat Feed -->
      <section id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="messages-list" class="space-y-4"></div>
      </section>

      <!-- Message Input -->
      <footer class="p-4 pt-0 shrink-0">
        <form id="message-form" class="bg-discord-light rounded-lg px-4 py-2.5 flex items-center space-x-3">
          <input id="message-input" type="text" placeholder="Message on Discord by Nexora Hub..." class="bg-transparent text-discord-text placeholder-discord-muted focus:outline-none flex-1 text-sm" autocomplete="off">
          <button type="submit" class="text-discord-accent hover:text-white font-bold text-sm">Send</button>
        </form>
      </footer>
    </main>
  </div>

  <script>
    // APP STATE MANAGEMENT
    const state = {
      currentUser: '',
      viewMode: 'dm', // 'dm' or 'server'
      activeTarget: 'general',
      servers: [
        { id: 'srv-1', name: 'Nexora Hub Main', icon: 'NH', channels: ['general', 'announcements'] }
      ],
      friends: [], // Array of friend Peer IDs
      messages: {
        'general': [{ sender: 'System', text: 'Welcome to Discord by Nexora Hub!' }]
      }
    };

    let peer = null;
    let connections = {};

    // LOGIN & AUTHENTICATION
    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('auth-username').value.trim();
      if (!user) return;

      state.currentUser = user;
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = user;
      document.getElementById('user-avatar').innerText = user[0].toUpperCase();

      initPeer(user);
      renderAll();
    });

    function logout() {
      location.reload();
    }

    // PEERJS WEBSOCKET INITIALIZATION
    function initPeer(username) {
      const cleanName = username.toLowerCase().replace(/[^a-z0-9]/g, '');
      const uniqueId = `nexora-${cleanName}-${Math.floor(1000 + Math.random() * 9000)}`;

      peer = new Peer(uniqueId);

      peer.on('open', (id) => {
        document.getElementById('my-peer-id').innerText = id;
      });

      peer.on('connection', (conn) => {
        setupConnection(conn);
      });
    }

    function setupConnection(conn) {
      connections[conn.peer] = conn;

      conn.on('open', () => {
        if (!state.friends.includes(conn.peer)) {
          state.friends.push(conn.peer);
          renderAll();
        }
      });

      conn.on('data', (data) => {
        const key = data.target || conn.peer;
        if (!state.messages[key]) state.messages[key] = [];
        state.messages[key].push({ sender: data.sender, text: data.text });
        if (state.activeTarget === key) renderMessages();
      });
    }

    // SERVER CREATION & NAVIGATION
    function openCreateServerModal() { document.getElementById('create-server-modal').classList.remove('hidden'); }
    function openAddFriendModal() { document.getElementById('add-friend-modal').classList.remove('hidden'); }
    function closeModals() {
      document.getElementById('create-server-modal').classList.add('hidden');
      document.getElementById('add-friend-modal').classList.add('hidden');
    }

    function confirmCreateServer() {
      const name = document.getElementById('new-server-name').value.trim();
      if (!name) return;

      const newServer = {
        id: `srv-${Date.now()}`,
        name: name,
        icon: name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 3),
        channels: ['general', 'lounge']
      };

      state.servers.push(newServer);
      document.getElementById('new-server-name').value = '';
      closeModals();
      switchToServer(newServer.id);
    }

    function confirmAddFriend() {
      const friendId = document.getElementById('friend-peer-id').value.trim();
      if (!friendId || friendId === peer.id) return;

      const conn = peer.connect(friendId);
      setupConnection(conn);

      document.getElementById('friend-peer-id').value = '';
      closeModals();
      switchToDMView();
    }

    function switchToDMView() {
      state.viewMode = 'dm';
      state.activeTarget = 'friends-home';
      document.getElementById('sidebar-header-title').innerText = "Direct Messages";
      renderAll();
    }

    function switchToServer(serverId) {
      const server = state.servers.find(s => s.id === serverId);
      if (!server) return;

      state.viewMode = 'server';
      state.activeServer = server;
      state.activeTarget = server.channels[0];
      document.getElementById('sidebar-header-title').innerText = server.name;
      renderAll();
    }

    // RENDER FUNCTIONS
    function renderAll() {
      renderServerList();
      renderSidebarContent();
      renderHeader();
      renderMessages();
    }

    function renderServerList() {
      const list = document.getElementById('server-list');
      list.innerHTML = state.servers.map(s => `
        <button onclick="switchToServer('${s.id}')" class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-discord-darker hover:bg-discord-accent text-white flex items-center justify-center transition-all duration-200 font-bold text-sm">
          ${s.icon}
        </button>
      `).join('');
    }

    function renderSidebarContent() {
      const container = document.getElementById('channel-or-friend-container');
      
      if (state.viewMode === 'server' && state.activeServer) {
        container.innerHTML = `
          <div class="mb-2">
            <span class="text-xs font-bold text-discord-muted uppercase tracking-wider px-2">Text Channels</span>
            <div class="mt-1 space-y-1">
              ${state.activeServer.channels.map(ch => `
                <button onclick="switchChannel('${ch}')" class="w-full flex items-center space-x-2 px-2 py-1.5 rounded text-discord-muted hover:bg-discord-light/40 hover:text-discord-text ${state.activeTarget === ch ? 'bg-discord-light/60 text-white' : ''}">
                  <i class="fa-solid fa-hashtag"></i>
                  <span class="text-sm font-medium">${ch}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="mb-2">
            <div class="flex items-center justify-between px-2 mb-2">
              <span class="text-xs font-bold text-discord-muted uppercase tracking-wider">Direct Messages</span>
              <button onclick="openAddFriendModal()" class="text-discord-muted hover:text-white"><i class="fa-solid fa-plus text-xs"></i></button>
            </div>
            <div class="space-y-1">
              ${state.friends.map(f => `
                <button onclick="switchDM('${f}')" class="w-full flex items-center space-x-2 px-2 py-1.5 rounded text-discord-muted hover:bg-discord-light/40 hover:text-discord-text ${state.activeTarget === f ? 'bg-discord-light/60 text-white' : ''}">
                  <div class="w-6 h-6 rounded-full bg-discord-accent flex items-center justify-center text-white text-xs font-bold">${f[7].toUpperCase()}</div>
                  <span class="text-xs font-medium truncate">${f}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function renderHeader() {
      const icon = document.getElementById('header-icon');
      const title = document.getElementById('chat-title');
      const actions = document.getElementById('header-actions');

      if (state.viewMode === 'server') {
        icon.className = "fa-solid fa-hashtag text-discord-muted text-xl";
        title.innerText = state.activeTarget;
        actions.innerHTML = '';
      } else {
        icon.className = "fa-solid fa-at text-discord-muted text-xl";
        title.innerText = state.activeTarget;
        actions.innerHTML = `
          <button onclick="openAddFriendModal()" class="bg-discord-green hover:bg-discord-green/80 text-white text-xs font-bold px-3 py-1.5 rounded transition">
            Add Friend
          </button>
        `;
      }
    }

    function switchChannel(channel) {
      state.activeTarget = channel;
      renderAll();
    }

    function switchDM(friendId) {
      state.activeTarget = friendId;
      renderAll();
    }

    // MESSAGE SENDING & HANDLING
    document.getElementById('message-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const target = state.activeTarget;
      if (!state.messages[target]) state.messages[target] = [];

      state.messages[target].push({ sender: state.currentUser, text });

      // If active target is a Peer ID, send via WebSockets
      if (connections[target] && connections[target].open) {
        connections[target].send({ sender: state.currentUser, text, target });
      }

      input.value = '';
      renderMessages();
    });

    function renderMessages() {
      const list = document.getElementById('messages-list');
      const msgs = state.messages[state.activeTarget] || [];

      list.innerHTML = msgs.map(m => `
        <div class="flex space-x-3 hover:bg-black/5 -mx-4 px-4 py-1 rounded">
          <div class="w-10 h-10 rounded-full bg-discord-accent flex items-center justify-center text-white font-bold text-sm shrink-0">
            ${m.sender[0].toUpperCase()}
          </div>
          <div>
            <div class="flex items-baseline space-x-2">
              <span class="font-semibold text-white text-sm">${m.sender}</span>
            </div>
            <p class="text-discord-text text-sm mt-0.5">${m.text}</p>
          </div>
        </div>
      `).join('');

      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function copyMyId() {
      const id = document.getElementById('my-peer-id').innerText;
      navigator.clipboard.writeText(id);
      alert("Copied your Live ID! Send this to your friend to add you.");
    }
  </script>
</body>
</html>
